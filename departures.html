
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barn Departures</title>
<style>
  body { margin: 0; background: #0c0c0c; font-family: 'Courier New', monospace; }
  .board { padding: 2rem; }
  .header { display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #333; padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .title { color: #fca5a5; font-size: 32px; letter-spacing: 4px; }
  .updated { color: #9ca3af; font-size: 18px; }
  .col-headers, .row { display: grid;
    grid-template-columns: 130px 1.3fr 1fr 1fr 1.1fr 90px 220px; gap: 16px; align-items: center; }
  .col-headers { font-family: 'Arial', 'Helvetica Neue', sans-serif; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 8px 12px; }
  .row { padding: 16px 12px; border-top: 1px solid #222; font-size: 22px; }
  .horse { color: #fff; letter-spacing: 1px; }
  .date { color: #e5e7eb; }
  .place { color: #d1d5db; }
  .driver { color: #9ca3af; font-size: 22px; }
  .stall { color: #e5e7eb; }
  .status { background: #1a1a1a; border: 1px solid #333; padding: 8px 14px;
            border-radius: 6px; color: #fde047; font-size: 20px; text-align: center; }
  .empty { color: #6b7280; font-size: 20px; padding: 2rem 12px; text-align: center; }
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div class="title">DEPARTURES</div>
    <div class="updated" id="updated">loading…</div>
  </div>
  <div class="col-headers">
    <div>DATE</div><div>HORSE</div><div>ORIGIN</div><div>TO</div><div>DRIVER</div><div>STALL</div><div>STATUS</div>
  </div>
  <div id="rows"><div class="empty">Loading departures…</div></div>
</div>

<script>
// ---- CONFIGURE THIS ----
// Paste the shared/public URL of departures.json produced by your Power Automate flow.
const DATA_URL = "https://raw.githubusercontent.com/canumanu/barn-boards/main/departures.json";
const REFRESH_SECONDS = 60;
// -------------------------

function render(rows) {
  const container = document.getElementById('rows');
  if (!rows || rows.length === 0) {
    container.innerHTML = '<div class="empty">No departures today.</div>';
    return;
  }
  container.innerHTML = rows.map(r => `
    <div class="row">
      <div class="date">${r.date || ''}</div>
      <div class="horse">${(r.horse || '').toUpperCase()}</div>
      <div class="place">${r.from || ''}</div>
      <div class="place">${r.to || ''}</div>
      <div class="driver">${r.driver || ''}</div>
      <div class="stall">${r.stall || ''}</div>
      <div><span class="status">DEPARTING TODAY</span></div>
    </div>`).join('');
}

async function refresh() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    const data = await res.json();
    render(data);
    document.getElementById('updated').textContent =
      'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('updated').textContent = 'connection error — retrying…';
    console.error(err);
  }
}

refresh();
setInterval(refresh, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
