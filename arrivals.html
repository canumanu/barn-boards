<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barn Arrivals</title>
<style>
  body { margin: 0; background: #0c0c0c; font-family: 'Courier New', monospace; }
  .board { padding: 2rem; }
  .header { display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #333; padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .title { color: #93c5fd; font-size: 32px; letter-spacing: 4px; }
  .updated { color: #9ca3af; font-size: 18px; }
  .col-headers, .row { display: grid;
    grid-template-columns: 130px 1.3fr 1fr 1fr 1.1fr 90px 220px; gap: 16px; align-items: center; }
  .col-headers { font-family: 'Arial', 'Helvetica Neue', sans-serif; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 8px 12px; }
  .row { padding: 16px 12px; border-top: 1px solid #222; font-size: 22px; }
  .horse { color: #fff; letter-spacing: 1px; }
  .date { color: #e5e7eb; }
  .place { color: #d1d5db; }
  .driver { color: #9ca3af; font-size: 22px; }
  .stall { color: #e5e7eb; }
  .status { background: #1a1a1a; border: 1px solid #333; padding: 8px 14px;
            border-radius: 6px; color: #93c5fd; font-size: 20px; text-align: center; }
  .empty { color: #6b7280; font-size: 20px; padding: 2rem 12px; text-align: center; }
  .page-dots { display: flex; justify-content: center; gap: 10px; margin-top: 1.5rem; }
  .page-dot { width: 12px; height: 12px; border-radius: 50%; background: #333; transition: background 0.3s ease; }
  .page-dot.active { background: #93c5fd; }
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div class="title">ARRIVALS</div>
    <div class="updated" id="updated">loading…</div>
  </div>
  <div class="col-headers">
    <div>DATE</div><div>HORSE</div><div>FROM</div><div>DESTINATION</div><div>DRIVER</div><div>STALL</div><div>STATUS</div>
  </div>
  <div id="rows"><div class="empty">Loading arrivals…</div></div>
  <div class="page-dots" id="pageDots"></div>
</div>

<script>
// ---- CONFIGURE THIS ----
// Paste the shared/public URL of arrivals.json produced by your Power Automate flow.
const DATA_URL = "https://raw.githubusercontent.com/canumanu/barn-boards/main/arrivals.json";
const REFRESH_SECONDS = 60;
const ROWS_PER_PAGE = 10;
const PAGE_SECONDS = 10;
// -------------------------

let allRows = [];
let currentPage = 0;
let pageTimer = null;

function renderPage() {
  const container = document.getElementById('rows');
  const dotsEl = document.getElementById('pageDots');

  if (!allRows || allRows.length === 0) {
    container.innerHTML = '<div class="empty">No arrivals today.</div>';
    dotsEl.innerHTML = '';
    return;
  }

  const pageCount = Math.max(1, Math.ceil(allRows.length / ROWS_PER_PAGE));
  if (currentPage >= pageCount) currentPage = 0;

  const start = currentPage * ROWS_PER_PAGE;
  const rows = allRows.slice(start, start + ROWS_PER_PAGE);

  container.innerHTML = rows.map(r => `
    <div class="row">
      <div class="date">${r.date || ''}</div>
      <div class="horse">${(r.horse || '').toUpperCase()}</div>
      <div class="place">${r.from || ''}</div>
      <div class="place">${r.to || ''}</div>
      <div class="driver">${r.driver || ''}</div>
      <div class="stall">${r.stall || ''}</div>
      <div><span class="status">ARRIVING TODAY</span></div>
    </div>`).join('');

  if (pageCount > 1) {
    dotsEl.innerHTML = Array.from({ length: pageCount }).map((_, i) =>
      `<div class="page-dot${i === currentPage ? ' active' : ''}"></div>`).join('');
  } else {
    dotsEl.innerHTML = '';
  }
}

function startPageRotation() {
  if (pageTimer) clearInterval(pageTimer);
  pageTimer = setInterval(() => {
    const pageCount = Math.max(1, Math.ceil(allRows.length / ROWS_PER_PAGE));
    if (pageCount <= 1) return;
    currentPage = (currentPage + 1) % pageCount;
    renderPage();
  }, PAGE_SECONDS * 1000);
}

async function refresh() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    const data = await res.json();
    allRows = data || [];
    renderPage();
    document.getElementById('updated').textContent =
      'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('updated').textContent = 'connection error — retrying…';
    console.error(err);
  }
}

refresh();
startPageRotation();
setInterval(refresh, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
